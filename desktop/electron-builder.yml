appId: com.aliahad.wovoice.desktop
productName: WoVoice
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
extraResources:
  - from: native/tapd
    to: tapd
protocols:
  - name: WoVoice
    schemes: [wovoice]
mac:
  category: public.app-category.productivity
  identity: "Apple Development: aliahadmd1@gmail.com (J9N3B2KAPR)"
  hardenedRuntime: true
  target:
    - target: dmg
    - target: dir
  extendInfo:
    - NSMicrophoneUsageDescription: WoVoice needs microphone access to convert your speech into text.
    - NSAppleEventsUsageDescription: WoVoice sends a paste keystroke to the app you are using to insert your dictated text.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
