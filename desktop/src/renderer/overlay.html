<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>WoVoice</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self' blob:"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      .pill {
        box-sizing: border-box;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 22px;
        background: rgba(0, 0, 0, 0.72);
        border: 1px solid rgba(125, 228, 182, 0.2);
        border-radius: 22px;
      }
      .bars {
        display: flex;
        align-items: center;
        gap: 6px;
        height: 56px;
      }
      .bar {
        width: 4px;
        border-radius: 2px;
        background: #7de4b6;
        height: 14px;
      }
      .label {
        flex: 1;
        color: #f7f6f8;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 13px;
        line-height: 1.3;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .cancel {
        width: 26px;
        height: 26px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.14);
        color: #f7f6f8;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="pill">
      <div class="bars" id="bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="label" id="label">Listening… (release to transcribe)</div>
      <button class="cancel" id="cancel" title="Cancel">✕</button>
    </div>
    <script type="module" src="/src/overlay/overlay.ts"></script>
  </body>
</html>
