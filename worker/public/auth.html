<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Sign in to WoVoice</title><link rel="stylesheet" href="/styles.css"><script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" defer></script><script src="/auth.js" defer></script></head><body><main><div class="brand"><span class="mark" aria-hidden="true"></span>WoVoice</div><section class="card" id="email-step"><h2>Sign in or register</h2><p class="note">We’ll email a six-digit verification code. No password required.</p><form id="email-form"><div class="field"><label for="email">Email address</label><input id="email" name="email" type="email" autocomplete="email" inputmode="email" required maxlength="254"></div><div id="turnstile"></div><label class="check"><input id="terms" type="checkbox" required><span>I agree to the <a href="/terms" target="_blank">Terms</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</span></label><button id="send" type="submit">Send verification code</button><p class="status" id="email-status" role="status"></p></form></section><section class="card hidden" id="code-step"><h2>Check your email</h2><p class="note" id="sent-to"></p><form id="code-form"><div class="field"><label for="code">Verification code</label><input class="code" id="code" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required></div><button id="verify" type="submit">Verify and return to WoVoice</button><div class="actions"><button class="secondary" id="restart" type="button">Use another email</button></div><p class="status" id="code-status" role="status"></p></form></section><section class="card hidden" id="invalid-step"><h2>Open this page from WoVoice</h2><p class="note">The secure sign-in request is missing. Return to the WoVoice app and tap Sign in.</p></section></main></body></html>
