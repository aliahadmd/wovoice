<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Return to WoVoice</title>
    <link rel="stylesheet" href="/styles.css">
    <script src="/app/callback.js" defer></script>
  </head>
  <body>
    <main>
      <div class="brand"><span class="mark" aria-hidden="true"></span>WoVoice</div>
      <section class="card">
        <h2 id="callback-title">Return to WoVoice</h2>
        <p class="lead" id="callback-message">Your email is verified. WoVoice should open automatically.</p>
        <a class="button" id="open-app" href="#">Open WoVoice</a>
        <p class="note" id="callback-help">If the app stays closed, tap the button now to finish secure sign-in.</p>
      </section>
    </main>
  </body>
</html>
