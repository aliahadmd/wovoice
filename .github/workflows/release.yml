name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        default: "1.5.0"

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      WOVOICE_KEYSTORE_PATH: ${{ runner.temp }}/wovoice-release-v2.jks
      WOVOICE_STORE_PASSWORD: ${{ secrets.WOVOICE_STORE_PASSWORD }}
      WOVOICE_KEY_ALIAS: ${{ secrets.WOVOICE_KEY_ALIAS }}
      WOVOICE_KEY_PASSWORD: ${{ secrets.WOVOICE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "1.5.0"
          grep -q 'versionName = "1.5.0"' app/build.gradle.kts
          grep -q 'versionCode = 6' app/build.gradle.kts

      - name: Test Worker and admin portal
        working-directory: worker
        run: |
          npm ci
          npm test
          npm run build

      - name: Restore release keystore
        env:
          WOVOICE_KEYSTORE_BASE64: ${{ secrets.WOVOICE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$WOVOICE_KEYSTORE_BASE64"
          printf '%s' "$WOVOICE_KEYSTORE_BASE64" | base64 --decode > "$WOVOICE_KEYSTORE_PATH"
          chmod 600 "$WOVOICE_KEYSTORE_PATH"

      - name: Test and build signed APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Verify and package APK
        env:
          EXPECTED_CERT: ${{ vars.WOVOICE_SIGNING_CERT_SHA256 }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          ACTUAL_CERT=$($APKSIGNER verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print toupper($2); exit}')
          NORMALIZED_EXPECTED=$(printf '%s' "$EXPECTED_CERT" | tr -d ':' | tr '[:lower:]' '[:upper:]')
          test "$ACTUAL_CERT" = "$NORMALIZED_EXPECTED"
          mkdir -p release
          cp "$APK" "release/WoVoice-$RELEASE_VERSION.apk"
          (cd release && sha256sum "WoVoice-$RELEASE_VERSION.apk" > "WoVoice-$RELEASE_VERSION.apk.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          if gh release view v1.4.0 >/dev/null 2>&1; then
            gh release delete v1.4.0 --yes --cleanup-tag
          fi
          gh release create "v$RELEASE_VERSION" \
            "release/WoVoice-$RELEASE_VERSION.apk" \
            "release/WoVoice-$RELEASE_VERSION.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "WoVoice $RELEASE_VERSION — Dedicated Admin Portal" \
            --notes "WoVoice $RELEASE_VERSION replaces Cloudflare Access with a first-party email-verified admin portal, keeps the speech-first Android keyboard private by design, and introduces a new public release signing identity. Existing v1.3 installations require uninstalling before installing this release."
