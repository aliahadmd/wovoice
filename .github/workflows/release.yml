name: Publish Android release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Release platform
        type: choice
        required: true
        default: android
        options:
          - android
          - desktop
          - all

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' && (inputs.platform == 'android' || inputs.platform == 'all')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WOVOICE_KEYSTORE_PATH: ${{ github.workspace }}/.release/wovoice-release-v2.jks
      WOVOICE_STORE_PASSWORD: ${{ secrets.WOVOICE_STORE_PASSWORD }}
      WOVOICE_KEY_ALIAS: ${{ secrets.WOVOICE_KEY_ALIAS }}
      WOVOICE_KEY_PASSWORD: ${{ secrets.WOVOICE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Matches the daemon JVM pinned in gradle/gradle-daemon-jvm.properties.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: worker/package-lock.json

      # The single source of truth for a release version is app/build.gradle.kts.
      - name: Resolve release version
        run: |
          set -euo pipefail
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)"$/\1/p' app/build.gradle.kts)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+)$/\1/p' app/build.gradle.kts)
          test -n "$VERSION"
          test -n "$CODE"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf 'Publishing WoVoice %s (versionCode %s)\n' "$VERSION" "$CODE"

      - name: Test Worker and admin portal
        working-directory: worker
        run: |
          npm ci
          npm test
          npm run build

      - name: Restore release keystore
        env:
          WOVOICE_KEYSTORE_BASE64: ${{ secrets.WOVOICE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$WOVOICE_KEYSTORE_BASE64"
          mkdir -p "$(dirname "$WOVOICE_KEYSTORE_PATH")"
          printf '%s' "$WOVOICE_KEYSTORE_BASE64" | base64 --decode > "$WOVOICE_KEYSTORE_PATH"
          chmod 600 "$WOVOICE_KEYSTORE_PATH"

      - name: Test and build signed APK
        run: ./gradlew :app:testDebugUnitTest :shared:test assembleRelease

      - name: Verify and package APK
        env:
          EXPECTED_CERT: ${{ vars.WOVOICE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL_CERT=$(printf '%s\n' "$CERT_OUTPUT" \
            | sed -nE 's/^.*certificate SHA-256 digest:[[:space:]]*([[:xdigit:]:]+).*$/\1/p' \
            | head -n 1 \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')
          NORMALIZED_EXPECTED=$(printf '%s' "$EXPECTED_CERT" \
            | tr -d ':[:space:]' \
            | tr '[:lower:]' '[:upper:]')
          test -n "$ACTUAL_CERT"
          printf 'Verified release certificate SHA-256: %s\n' "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$NORMALIZED_EXPECTED"
          mkdir -p release
          cp "$APK" "release/WoVoice-$RELEASE_VERSION.apk"
          (cd release && sha256sum "WoVoice-$RELEASE_VERSION.apk" > "WoVoice-$RELEASE_VERSION.apk.sha256")

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION already exists." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path("CHANGELOG.md").read_text()
          heading = f"## {os.environ['RELEASE_VERSION']} — "
          section = next(part for part in text.split("\n## ") if part.startswith(heading[3:]))
          notes = section.split("\n", 1)[1].strip()
          Path("release/notes.md").write_text(notes + "\n")
          PY
          gh release create "v$RELEASE_VERSION" \
            "release/WoVoice-$RELEASE_VERSION.apk" \
            "release/WoVoice-$RELEASE_VERSION.apk.sha256" \
            --target "$GITHUB_SHA" \
            --title "WoVoice $RELEASE_VERSION" \
            --notes-file release/notes.md

  # Builds and publishes the macOS DMG the README documents as a download —
  # desktop keeps its own desktop-vX.Y.Z release line.
  release-desktop:
    if: github.ref == 'refs/heads/main' && (inputs.platform == 'desktop' || inputs.platform == 'all')
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Resolve desktop version
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          test -n "$VERSION"
          echo "DESKTOP_VERSION=$VERSION" >> "$GITHUB_ENV"
          printf 'Publishing WoVoice Desktop %s\n' "$VERSION"

      - name: Install dependencies
        working-directory: desktop
        run: npm ci

      - name: Test
        working-directory: desktop
        run: |
          npm run typecheck
          npm test

      - name: Build DMG
        working-directory: desktop
        env:
          # CI uses a Developer ID identity when configured, otherwise an
          # explicit ad-hoc signature with its own runtime entitlements.
          WOVOICE_MAC_IDENTITY: ${{ secrets.WOVOICE_MAC_IDENTITY }}
        run: |
          set -euo pipefail
          npm run build:native
          npx electron-vite build
          ARGS=(--mac dmg)
          if [ -n "$WOVOICE_MAC_IDENTITY" ]; then
            ARGS+=("-c.mac.identity=$WOVOICE_MAC_IDENTITY")
          else
            ARGS+=("-c.mac.identity=-"
              "-c.mac.entitlements=build/entitlements.adhoc.mac.plist"
              "-c.mac.entitlementsInherit=build/entitlements.adhoc.mac.plist")
          fi
          npx electron-builder "${ARGS[@]}"

      - name: Verify macOS release bundle
        run: |
          set -euo pipefail
          APP=$(find desktop/dist -maxdepth 2 -type d -name WoVoice.app -print -quit)
          test -n "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Contents/Info.plist")" = "$DESKTOP_VERSION"
          codesign --verify --deep --strict --verbose=2 "$APP"
          for HELPER in tapd contextd; do
            test -x "$APP/Contents/Resources/$HELPER"
            codesign --verify --strict --verbose=2 "$APP/Contents/Resources/$HELPER"
          done
          ELECTRON_RUN_AS_NODE=1 "$APP/Contents/MacOS/WoVoice" -e 'if (!process.versions.electron) process.exit(1); console.log("Electron runtime loaded:", process.versions.electron)'

      - name: Publish desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="desktop-v$DESKTOP_VERSION"
          DMG="desktop/dist/wovoice-desktop-$DESKTOP_VERSION.dmg"
          test -f "$DMG"
          (cd desktop/dist && shasum -a 256 "$(basename "$DMG")" > "$(basename "$DMG").sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" "$DMG.sha256" --clobber
          else
            gh release create "$TAG" "$DMG" "$DMG.sha256" \
              --target "$GITHUB_SHA" \
              --title "WoVoice Desktop $DESKTOP_VERSION" \
              --notes "WoVoice Desktop $DESKTOP_VERSION release. See the repository README for install instructions."
          fi
